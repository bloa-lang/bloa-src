name: Universal Runtime Benchmark

on:
  workflow_dispatch:
  push:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php
          - php-jit
          - go
          - java
          - bloa

    steps:
      - uses: actions/checkout@v7

      - name: Generate Benchmarks
        shell: bash
        run: |
          mkdir -p benchmarks results

          cat > benchmarks/int_loop.php << 'EOF'
          <?php
          $start = microtime(true);

          $sum = 0;

          for ($i = 0; $i < 50000000; $i++) {
              $sum += $i;
          }

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/float_math.php << 'EOF'
          <?php
          $start = microtime(true);

          $x = 0.0;

          for ($i = 0; $i < 10000000; $i++) {
              $x += sqrt($i) * sin($i);
          }

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/string_concat.php << 'EOF'
          <?php
          $start = microtime(true);

          $str = "";

          for ($i = 0; $i < 200000; $i++) {
              $str .= "abc";
          }

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/array_access.php << 'EOF'
          <?php
          $start = microtime(true);

          $arr = range(1, 1000000);

          $sum = 0;

          foreach ($arr as $v) {
              $sum += $v;
          }

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/function_call.php << 'EOF'
          <?php
          function test($x) {
              return $x + 1;
          }

          $start = microtime(true);

          $x = 0;

          for ($i = 0; $i < 20000000; $i++) {
              $x = test($x);
          }

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/json_test.php << 'EOF'
          <?php
          $data = [];

          for ($i = 0; $i < 100000; $i++) {
              $data[] = [
                  "id" => $i,
                  "name" => "user$i",
                  "value" => rand()
              ];
          }

          $start = microtime(true);

          $json = json_encode($data);
          json_decode($json, true);

          echo microtime(true) - $start;
          EOF

          cat > benchmarks/main.go << 'EOF'
          package main

          import (
              "encoding/json"
              "fmt"
              "math"
              "strings"
              "time"
          )

          func benchmark(name string, fn func()) {
              start := time.Now()
              fn()
              fmt.Printf("%s = %.6f\n", name, time.Since(start).Seconds())
          }

          func main() {

              benchmark("int_loop", func() {
                  sum := 0

                  for i := 0; i < 50000000; i++ {
                      sum += i
                  }

                  _ = sum
              })

              benchmark("float_math", func() {
                  x := 0.0

                  for i := 0; i < 10000000; i++ {
                      x += math.Sqrt(float64(i)) * math.Sin(float64(i))
                  }

                  _ = x
              })

              benchmark("string_concat", func() {
                  s := ""

                  for i := 0; i < 200000; i++ {
                      s += "abc"
                  }

                  _ = s
              })

              benchmark("array_access", func() {
                  arr := make([]int, 1000000)

                  sum := 0

                  for _, v := range arr {
                      sum += v
                  }

                  _ = sum
              })

              benchmark("function_call", func() {
                  x := 0

                  test := func(v int) int {
                      return v + 1
                  }

                  for i := 0; i < 20000000; i++ {
                      x = test(x)
                  }

                  _ = x
              })

              benchmark("json_test", func() {
                  data := []map[string]any{}

                  for i := 0; i < 100000; i++ {
                      data = append(data, map[string]any{
                          "id": i,
                          "name": fmt.Sprintf("user%d", i),
                          "value": i,
                      })
                  }

                  encoded, _ := json.Marshal(data)

                  var decoded any

                  json.Unmarshal(encoded, &decoded)
              })

              benchmark("string_builder", func() {
                  var b strings.Builder

                  for i := 0; i < 500000; i++ {
                      b.WriteString("abc")
                  }

                  _ = b.String()
              })
          }
          EOF

          cat > benchmarks/Benchmark.java << 'EOF'
          import java.util.*;
          import java.lang.Math;

          public class Benchmark {

              static void benchmark(String name, Runnable fn) {
                  long start = System.nanoTime();

                  fn.run();

                  double time = (System.nanoTime() - start) / 1e9;

                  System.out.println(name + " = " + time);
              }

              public static void main(String[] args) {

                  benchmark("int_loop", () -> {
                      long sum = 0;

                      for (int i = 0; i < 50000000; i++) {
                          sum += i;
                      }
                  });

                  benchmark("float_math", () -> {
                      double x = 0;

                      for (int i = 0; i < 10000000; i++) {
                          x += Math.sqrt(i) * Math.sin(i);
                      }
                  });

                  benchmark("string_concat", () -> {
                      String s = "";

                      for (int i = 0; i < 200000; i++) {
                          s += "abc";
                      }
                  });

                  benchmark("array_access", () -> {
                      int[] arr = new int[1000000];

                      long sum = 0;

                      for (int v : arr) {
                          sum += v;
                      }
                  });

                  benchmark("function_call", () -> {
                      final int[] x = {0};

                      Runnable fn = () -> {
                          x[0]++;
                      };

                      for (int i = 0; i < 20000000; i++) {
                          fn.run();
                      }
                  });

                  benchmark("hashmap_test", () -> {
                      HashMap<Integer, Integer> map = new HashMap<>();

                      for (int i = 0; i < 1000000; i++) {
                          map.put(i, i);
                      }

                      long sum = 0;

                      for (int i = 0; i < 1000000; i++) {
                          sum += map.get(i);
                      }
                  });
              }
          }
          EOF

      - name: Setup PHP
        if: contains(matrix.runtime, 'php')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bloa Dependencies
        if: matrix.runtime == 'bloa'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            bison \
            re2c \
            build-essential \
            libc6-dev \
            gettext \
            libgmp-dev \
            libmhash-dev \
            pkg-config \
            zlib1g-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libreadline-dev \
            libedit-dev \
            libsqlite3-dev \
            libzip-dev \
            libonig-dev \
            libbz2-dev \
            libxslt1-dev

      - name: Build Bloa
        if: matrix.runtime == 'bloa'
        run: |
          set -euxo pipefail

          # Sanitize compiler and linker flags for CI to avoid -march=native / LTO issues,
          # and ensure pthread is available to configure/link tests.
          export CC=gcc
          export CXX=g++
          # Use mtune=generic instead of -march=x86-64 to avoid platform-specific instructions
          export CFLAGS="-g -O2 -pipe -D_GNU_SOURCE -fno-lto -mtune=generic -pthread"
          export CXXFLAGS="$CFLAGS"
          export CPPFLAGS=""
          export LDFLAGS="-pthread"
          # Hint to configure/autotools to avoid enabling LTO if it autodetects support
          export ac_cv_prog_gcc_have_lto=no

          # Preseed configure cache for functions that mis-detect on Ubuntu runners
          # These avoid running conftest programs that use non-portable prototypes
          export ac_cv_func_asctime_r=yes
          export ac_cv_func_gethostbyname_r=no
          export ac_cv_func_issetugid=no
          export ac_cv_func_memcntl=no
          export ac_cv_func_memset_explicit=no
          export ac_cv_func_pthread_jit_write_protect_np=no
          export ac_cv_func_std_syslog=no

          # Use env so autotools see the sanitized toolchain flags
          env CC="$CC" CXX="$CXX" CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" ./buildconf --force
          env CC="$CC" CXX="$CXX" CFLAGS="$CFLAGS" CXXFLAGS="$CXXFLAGS" LDFLAGS="$LDFLAGS" ./configure --enable-cli CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" 2>&1 | tee configure.log

          # Build with verbose output; on failure print a large tail of the build log
          # If debugging is needed, remove -j$(nproc) to run single-threaded and see the first error.
          make -j$(nproc) V=1 2>&1 | tee build.log || (echo "--- Build failed, tail of build.log: ---" && tail -n 500 build.log && exit 1)

      - name: Show config.log
        if: failure() && matrix.runtime == 'bloa'
        run: |
          cat config.log || true

      - name: Upload build logs on failure
        if: failure() && matrix.runtime == 'bloa'
        uses: actions/upload-artifact@v6
        with:
          name: bloa-build-logs
          path: |
            configure.log
            build.log

      - name: Run PHP
        if: matrix.runtime == 'php'
        run: |
          for file in benchmarks/*.php; do
              echo "=== $(basename \"$file\") ===" \
                | tee -a results/php.txt

              for i in {1..5}; do
                  php "$file" \
                    | tee -a results/php.txt
              done

              echo \
                | tee -a results/php.txt
          done

      - name: Run PHP JIT
        if: matrix.runtime == 'php-jit'
        run: |
          for file in benchmarks/*.php; do
              echo "=== $(basename \"$file\") ===" \
                | tee -a results/php-jit.txt

              for i in {1..5}; do
                  php \
                    -dopcache.enable_cli=1 \
                    -dopcache.jit_buffer_size=256M \
                    -dopcache.jit=tracing \
                    "$file" \
                    | tee -a results/php-jit.txt
              done

              echo \
                | tee -a results/php-jit.txt
          done

      - name: Run Go
        if: matrix.runtime == 'go'
        run: |
          go run benchmarks/main.go \
            | tee results/go.txt

      - name: Run Java
        if: matrix.runtime == 'java'
        run: |
          javac benchmarks/Benchmark.java

          java -cp benchmarks Benchmark \
            | tee results/java.txt

      - name: Run Bloa
        if: matrix.runtime == 'bloa'
        run: |
          for file in benchmarks/*.php; do
              echo "=== $(basename \"$file\") ===" \
                | tee -a results/bloa.txt

              for i in {1..5}; do
                  ./sapi/cli/bloa "$file" \
                    | tee -a results/bloa.txt
              done

              echo \
                | tee -a results/bloa.txt
          done

      - name: Upload Results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.runtime }}
          path: results/**
