name: Universal Runtime Benchmark

on:
  workflow_dispatch:
  push:

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php
          - php-jit
          - go
          - java
          - bloa
          - bloa-jit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        if: matrix.runtime == 'php' || matrix.runtime == 'php-jit'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: PHP Benchmark
        if: matrix.runtime == 'php'
        run: |
          php benchmark.php

      - name: PHP JIT Benchmark
        if: matrix.runtime == 'php-jit'
        run: |
          php \
            -dopcache.enable_cli=1 \
            -dopcache.jit_buffer_size=256M \
            -dopcache.jit=tracing \
            benchmark.php

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Go Benchmark
        if: matrix.runtime == 'go'
        run: |
          go run benchmark.go

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Java Compile
        if: matrix.runtime == 'java'
        run: |
          javac Benchmark.java

      - name: Java Benchmark
        if: matrix.runtime == 'java'
        run: |
          java Benchmark

      - name: Setup Bloa Build Dependencies
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config

      - name: Clone Bloa
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          git clone https://github.com/bloa-lang/bloa-src.git

      - name: Build Bloa
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          cd bloa-src

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build -j$(nproc)

      - name: Bloa Benchmark
        if: matrix.runtime == 'bloa'
        run: |
          cd bloa-src

          ./build/bloa \
            run \
            ../benchmark.bloa

      - name: Bloa JIT Benchmark
        if: matrix.runtime == 'bloa-jit'
        run: |
          cd bloa-src

          ./build/bloa \
            run \
            --jit \
            ../benchmark.bloa

      - name: Upload Results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.runtime }}
          path: |
            results/**
