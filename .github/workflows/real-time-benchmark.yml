name: Universal Runtime Benchmark

on:
  workflow_dispatch:
  push:

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php
          - php-jit
          - go
          - java
          - bloa
          - bloa-jit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Benchmark Files
        shell: bash
        run: |
          mkdir -p results

          cat > benchmark.php << 'EOF'
          <?php

          $start = microtime(true);

          $sum = 0;

          for ($i = 0; $i < 10000000; $i++) {
              $sum += $i;
          }

          echo "PHP Result: $sum\n";
          echo "Time: " . (microtime(true) - $start) . "\n";
          EOF

          cat > benchmark.go << 'EOF'
          package main

          import (
              "fmt"
              "time"
          )

          func main() {
              start := time.Now()

              sum := 0

              for i := 0; i < 10000000; i++ {
                  sum += i
              }

              fmt.Println("Go Result:", sum)
              fmt.Println("Time:", time.Since(start))
          }
          EOF

          cat > Benchmark.java << 'EOF'
          public class Benchmark {
              public static void main(String[] args) {
                  long start = System.nanoTime();

                  long sum = 0;

                  for (int i = 0; i < 10000000; i++) {
                      sum += i;
                  }

                  double time = (System.nanoTime() - start) / 1e9;

                  System.out.println("Java Result: " + sum);
                  System.out.println("Time: " + time);
              }
          }
          EOF

          cat > benchmark.bloa << 'EOF'
          let start = now()

          let sum = 0

          for let i = 0; i < 10000000; i++ {
              sum += i
          }

          println("Bloa Result: ${sum}")
          println("Time: ${now() - start}")
          EOF

      - name: Setup PHP
        if: matrix.runtime == 'php' || matrix.runtime == 'php-jit'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: PHP Benchmark
        if: matrix.runtime == 'php'
        run: php benchmark.php | tee results/php.txt

      - name: PHP JIT Benchmark
        if: matrix.runtime == 'php-jit'
        run: |
          php \
            -dopcache.enable_cli=1 \
            -dopcache.jit_buffer_size=256M \
            -dopcache.jit=tracing \
            benchmark.php | tee results/php-jit.txt

      - name: Setup Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Go Benchmark
        if: matrix.runtime == 'go'
        run: |
          go run benchmark.go | tee results/go.txt

      - name: Setup Java
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Java Benchmark
        if: matrix.runtime == 'java'
        run: |
          javac Benchmark.java
          java Benchmark | tee results/java.txt

      - name: Setup Bloa Dependencies
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            clang \
            cmake \
            ninja-build

      - name: Clone Bloa
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          git clone https://github.com/bloa-lang/bloa-src.git

      - name: Build Bloa
        if: matrix.runtime == 'bloa' || matrix.runtime == 'bloa-jit'
        run: |
          cd bloa-src

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build -j$(nproc)

      - name: Bloa Benchmark
        if: matrix.runtime == 'bloa'
        run: |
          ./bloa-src/build/bloa \
            run \
            benchmark.bloa | tee results/bloa.txt

      - name: Bloa JIT Benchmark
        if: matrix.runtime == 'bloa-jit'
        run: |
          ./bloa-src/build/bloa \
            run \
            --jit \
            benchmark.bloa | tee results/bloa-jit.txt

      - name: Upload Results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.runtime }}
          path: results/**
